{
  "schema_version": "qwenpaw-productivity-skill.v1",
  "name": "image-toolkit",
  "version": "1.0.0",
  "description": "Process at least one existing input image with deterministic Pillow inspection, conversion, geometry, metadata, batch, or duplicate operations. Never use for text-to-image or generating a new image from a prompt.",
  "entrypoint": "scripts/run.py",
  "handler": "image-toolkit",
  "operations": [
    "info",
    "exif",
    "hash",
    "convert",
    "resize",
    "crop",
    "rotate",
    "flip",
    "compress",
    "quality",
    "dpi",
    "strip_exif",
    "alpha",
    "concat",
    "split",
    "to_pdf",
    "duplicates",
    "batch_convert",
    "batch_compress"
  ],
  "capabilities": {
    "required": [
      "pillow"
    ],
    "optional": [
      "opencv",
      "imagemagick"
    ],
    "runtime": []
  },
  "statuses": [
    "SUCCESS",
    "PARTIAL_SUCCESS",
    "DEPENDENCY_MISSING",
    "MODEL_RUNTIME_REQUIRED",
    "UNSUPPORTED",
    "INVALID_INPUT",
    "FAILED"
  ],
  "artifact_contract": {
    "required_metadata": [
      "operation",
      "source",
      "output",
      "mime_type",
      "size",
      "checksum"
    ],
    "overwrite_source": false
  }
}
