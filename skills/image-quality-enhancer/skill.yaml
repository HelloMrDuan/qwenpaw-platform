{
  "schema_version": "qwenpaw-productivity-skill.v1",
  "name": "image-quality-enhancer",
  "version": "1.0.0",
  "description": "Enhance or upscale at least one existing input image using traditional processing and optional AI super-resolution. Never use for text-to-image or generating a new image from a prompt.",
  "entrypoint": "scripts/run.py",
  "handler": "image-quality-enhancer",
  "operations": [
    "enhance",
    "upscale_2x",
    "upscale_4x",
    "denoise",
    "sharpen",
    "gamma",
    "white_balance",
    "batch"
  ],
  "capabilities": {
    "required": [
      "pillow"
    ],
    "optional": [
      "opencv"
    ],
    "runtime": [
      "realesrgan"
    ]
  },
  "statuses": [
    "SUCCESS",
    "PARTIAL_SUCCESS",
    "DEPENDENCY_MISSING",
    "MODEL_RUNTIME_REQUIRED",
    "UNSUPPORTED",
    "INVALID_INPUT",
    "FAILED"
  ],
  "artifact_contract": {
    "required_metadata": [
      "operation",
      "source",
      "output",
      "mime_type",
      "size",
      "checksum"
    ],
    "overwrite_source": false
  }
}
